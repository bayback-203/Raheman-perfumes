<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <radialGradient id="halo" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#D8B878" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D8B878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCE95"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#9A7222"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8C6D2E" flood-opacity="0.14"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="116" rx="108" ry="84" fill="url(#halo)"/>
  <ellipse cx="140" cy="182" rx="68" ry="8" fill="#C89B3C" fill-opacity="0.14"/>
  <g filter="url(#shadow)">
    <!-- Back handle -->
    <path d="M114 78 C114 54 166 54 166 78" stroke="#9A7222" stroke-width="3" stroke-linecap="round"/>
    <!-- Luxury boutique bag -->
    <path d="M88 78 H192 L200 172 H80 Z" fill="#FFFDF8" stroke="url(#gold)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M88 78 L96 86 H184 L192 78" stroke="#E5CE9A" stroke-width="1"/>
    <!-- Front handle -->
    <path d="M114 82 C114 58 166 58 166 82" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Gold crest seal on bag -->
    <circle cx="140" cy="126" r="18" fill="#FAF4E6" stroke="url(#gold)" stroke-width="1.3"/>
    <path d="M132 128 L140 116 L148 128 L140 136 Z" fill="url(#gold)" fill-opacity="0.8"/>
    <!-- Mini sample vial beside bag -->
    <rect x="196" y="136" width="16" height="36" rx="4" fill="#FFFFFF" stroke="url(#gold)" stroke-width="1.4"/>
    <rect x="199" y="148" width="10" height="20" rx="2" fill="#F2DCAC" fill-opacity="0.7"/>
    <rect x="200" y="128" width="8" height="8" rx="2" fill="#1A1817"/>
  </g>
  <path d="M68 86 L70 92 L76 94 L70 96 L68 102 L66 96 L60 94 L66 92 Z" fill="url(#gold)"/>
</svg>
