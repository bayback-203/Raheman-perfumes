<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <radialGradient id="halo" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#D8B878" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D8B878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCE95"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#9A7222"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8C6D2E" flood-opacity="0.14"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="114" rx="112" ry="86" fill="url(#halo)"/>
  <ellipse cx="140" cy="182" rx="74" ry="9" fill="#C89B3C" fill-opacity="0.14"/>
  <g filter="url(#shadow)">
    <!-- Ornate golden compass -->
    <circle cx="118" cy="122" r="46" fill="#FFFDF8" stroke="url(#gold)" stroke-width="2.5"/>
    <circle cx="118" cy="122" r="38" fill="#FAF5EA" stroke="#D8B878" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="118" cy="68" r="6" stroke="url(#gold)" stroke-width="2" fill="#FFFDF8"/>
    <!-- Compass needle -->
    <polygon points="118,90 125,122 118,128 111,122" fill="url(#gold)"/>
    <polygon points="118,154 125,122 118,116 111,122" fill="#1A1817" fill-opacity="0.8"/>
    <circle cx="118" cy="122" r="4" fill="#FFFDF8" stroke="#1A1817" stroke-width="1.5"/>
    <!-- Perfume bottle beside compass -->
    <rect x="158" y="108" width="46" height="60" rx="8" fill="#FFFFFF" stroke="url(#gold)" stroke-width="1.8"/>
    <rect x="164" y="128" width="34" height="34" rx="4" fill="#F2DCAC" fill-opacity="0.65"/>
    <rect x="173" y="96" width="16" height="12" rx="2" fill="url(#gold)"/>
    <rect x="169" y="82" width="24" height="14" rx="4" fill="#1A1817"/>
    <rect x="168" y="132" width="26" height="16" rx="2" fill="#FFFDF9" stroke="#D8B878" stroke-width="0.9"/>
  </g>
  <!-- Delicate petals & sparkles -->
  <path d="M72 162 C62 152 65 140 76 144 C82 146 84 157 72 162 Z" fill="#EBBBC6" fill-opacity="0.75"/>
  <path d="M214 78 L216.5 84 L222.5 86.5 L216.5 89 L214 95 L211.5 89 L205.5 86.5 L211.5 84 Z" fill="url(#gold)"/>
</svg>
