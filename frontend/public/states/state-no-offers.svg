<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <radialGradient id="halo" cx="50%" cy="54%" r="44%">
      <stop offset="0%" stop-color="#D8B878" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#D8B878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBCE95"/>
      <stop offset="50%" stop-color="#C89B3C"/>
      <stop offset="100%" stop-color="#9A7222"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#8C6D2E" flood-opacity="0.14"/>
    </filter>
  </defs>
  <ellipse cx="140" cy="116" rx="108" ry="82" fill="url(#halo)"/>
  <ellipse cx="140" cy="182" rx="70" ry="8" fill="#C89B3C" fill-opacity="0.14"/>
  <g filter="url(#shadow)">
    <!-- Invitation card / gift voucher -->
    <rect x="74" y="88" width="112" height="74" rx="7" fill="#FFFDF8" stroke="url(#gold)" stroke-width="1.8"/>
    <rect x="82" y="96" width="96" height="58" rx="4" stroke="#E5CE9A" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="94" y1="114" x2="146" y2="114" stroke="#D8B878" stroke-width="2" stroke-linecap="round"/>
    <line x1="94" y1="126" x2="132" y2="126" stroke="#E5CE9A" stroke-width="2" stroke-linecap="round"/>
    <!-- Wax seal -->
    <circle cx="156" cy="134" r="14" fill="url(#gold)"/>
    <circle cx="156" cy="134" r="9" stroke="#FFFDF8" stroke-width="1" stroke-opacity="0.75"/>
    <!-- Amber flacon beside card -->
    <rect x="168" y="86" width="42" height="76" rx="8" fill="#FFFFFF" stroke="url(#gold)" stroke-width="1.8"/>
    <rect x="174" y="106" width="30" height="48" rx="4" fill="#E8BA66" fill-opacity="0.55"/>
    <rect x="181" y="74" width="16" height="12" rx="2" fill="url(#gold)"/>
    <rect x="178" y="60" width="22" height="14" rx="4" fill="#1A1817"/>
  </g>
  <path d="M68 74 L70 80 L76 82 L70 84 L68 90 L66 84 L60 82 L66 80 Z" fill="url(#gold)"/>
</svg>
